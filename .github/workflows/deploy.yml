# Deploy 3DPie.uz to GitHub Pages
# - Runs on every push to main
# - Publishes only the public site files (sources, scripts and notes are excluded)
# - Pages are built and checked here before publishing; keep committing the generated HTML too
#   (GitHub's own Pages build, while it is still on, publishes what is in the repository)
# - After deploy, pings IndexNow (Bing, Yandex) with all sitemap URLs

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Pages come from src/ and data/. Building here means a forgotten `npm run build` cannot publish
      # stale HTML, and a failed check (broken link, banned phrase, llms.txt out of step) stops the deploy.
      - name: Build and check
        run: |
          npm run build
          npm run check
          if [ -n "$(git status --porcelain)" ]; then
            echo "::warning::Generated files in the repository are out of date - run npm run build and commit them."
            git status --short | head -20
          fi

      - name: Collect public files
        run: |
          mkdir _site
          rsync -a ./ _site/ \
            --exclude '.git' --exclude '.github' --exclude '_site' \
            --exclude 'src' --exclude 'scripts' --exclude 'data' --exclude 'node_modules' \
            --exclude '*.md' --exclude 'package*.json' --exclude '.gitignore' \
            --exclude '.claude' --exclude '.shots' --exclude '.tools' --exclude 'docs' \
            --exclude '_config.yml'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  indexnow:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Notify IndexNow
        # Search engines are a courtesy notification — never fail the deploy because of them.
        continue-on-error: true
        run: node scripts/indexnow.js
